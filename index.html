<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyjazd do Danii 2026</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#123b4a,#1f6f78)}
main{width:min(900px,calc(100% - 32px));padding:60px 28px;text-align:center;border-radius:28px;background:rgba(0,0,0,.22);box-shadow:0 20px 70px rgba(0,0,0,.3)}
.icon{font-size:64px}
h1{font-size:clamp(42px,8vw,82px);line-height:1;margin:18px 0}
p{font-size:clamp(18px,2.4vw,24px);line-height:1.5;max-width:700px;margin:0 auto}
.badge{display:inline-block;margin-top:28px;padding:10px 18px;border-radius:999px;background:#fff;color:#164653;font-weight:700}
</style>
</head>
<body>
<main>
<div class="icon">🚐 🇩🇰</div>
<h1>Wyjazd do Danii 2026</h1>
<p>Wspólna podróż kamperami, Legoland, LEGO House, Kopenhaga i najlepsze miejsca po drodze.</p>
<div class="badge">KamperTeam.eu</div>
</main>
</body>
</html>
